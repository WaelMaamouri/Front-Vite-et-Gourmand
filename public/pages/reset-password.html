<section class="connexion-hero">
  <div class="container">
    <h1>Nouveau mot de passe</h1>
    <p>Choisissez un mot de passe sécurisé (10+ car., maj, min, chiffre, spécial).</p>
  </div>
</section>

<section class="connexion-section">
  <div class="container">
    <div class="connexion-card">
      <form id="reset-form">
        <label for="reset-password">Nouveau mot de passe *</label>
        <input
          type="password"
          id="reset-password"
          placeholder="********"
          required
          autocomplete="new-password"
        />

        <label for="reset-password2">Confirmer *</label>
        <input
          type="password"
          id="reset-password2"
          placeholder="********"
          required
          autocomplete="new-password"
        />

        <button type="submit" class="btn-connexion">Enregistrer</button>

        <p class="connexion-link">
          <a href="/connexion" data-link>Retour à la connexion</a>
        </p>
      </form>
    </div>
  </div>
</section>
