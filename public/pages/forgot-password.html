<section class="connexion-hero">
  <div class="container">
    <h1>Mot de passe oublié</h1>
    <p>Nous vous enverrons un lien par e-mail si le compte existe.</p>
  </div>
</section>

<section class="connexion-section">
  <div class="container">
    <div class="connexion-card">
      <form id="forgot-form">
        <label for="forgot-email">Email *</label>
        <input
          type="email"
          id="forgot-email"
          placeholder="vous@exemple.com"
          required
        />

        <button type="submit" class="btn-connexion">Envoyer le lien</button>

        <p class="connexion-link">
          <a href="/connexion" data-link>Retour à la connexion</a>
        </p>
      </form>
    </div>
  </div>
</section>
